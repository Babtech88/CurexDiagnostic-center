databases:
  - name: curex-db
    plan: free
    databaseName: curex
    user: curex

services:
  - type: web
    name: curex-diagnostic-center
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn salesplatform.wsgi:application"
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: curex-db
          property: connectionString
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: SITE_BASE_URL
        sync: false
      - key: WHATSAPP_CLOUD_API_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        value: curex-verify-2026
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: STAFF_NOTIFICATION_EMAILS
        sync: false
      - key: USE_S3
        value: "False"
