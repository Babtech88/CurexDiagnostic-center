{% extends "base_public.html" %}
{% block title %}Booking Sent{% endblock %}
{% block content %}
<div class="container">
<div class="text-center py-5">
  <i class="bi bi-check-circle-fill" style="font-size:4rem; color:var(--primary);"></i>
  <h3 class="mt-3 font-heading">Your booking request #{{ order.pk }} has been saved!</h3>
  <p class="text-muted">Tap below to send it to us on WhatsApp so we can confirm and prepare it.</p>
  <a href="{{ wa_link }}" target="_blank" class="btn btn-primary-brand btn-lg mt-2"><i class="bi bi-whatsapp"></i> Open WhatsApp to Confirm</a>
  <div class="mt-4"><a href="{% url 'storefront:catalog' %}">&larr; Continue shopping</a></div>
</div>
</div>
{% endblock %}
