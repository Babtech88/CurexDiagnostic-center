{% extends "base.html" %}
{% block title %}Delete Test / Item{% endblock %}
{% block content %}
<h3>Delete {{ product.name }}?</h3>
<div class="card border-0 shadow-sm p-4" style="max-width:500px;">
  <p>This will permanently remove the product and its sales history references. This cannot be undone.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'inventory:product_list' %}" class="btn btn-outline-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
