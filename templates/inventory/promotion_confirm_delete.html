{% extends "base.html" %}
{% block title %}Delete Promotion{% endblock %}
{% block content %}
<h3>Delete "{{ promotion.title }}"?</h3>
<div class="card border-0 shadow-sm p-4" style="max-width:500px;">
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'inventory:promotion_list' %}" class="btn btn-outline-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
