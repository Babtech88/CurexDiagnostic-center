{% extends "base.html" %}
{% block title %}Restock {{ product.name }}{% endblock %}
{% block content %}
<h3 class="mb-3">Restock {{ product.name }}</h3>
<p class="text-muted">Current stock: {{ product.stock_quantity }}</p>
<div class="card border-0 shadow-sm p-4" style="max-width:500px;">
  <form method="post">
    {% csrf_token %}
    {% include "_form_fields.html" %}
    <button type="submit" class="btn btn-success">Add Stock</button>
    <a href="{% url 'inventory:product_detail' product.pk %}" class="btn btn-outline-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
