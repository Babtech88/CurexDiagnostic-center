{% extends "base.html" %}
{% block title %}Public Profile — {{ profile.user.username }}{% endblock %}
{% block content %}
<h3 class="mb-3">Public Profile — {{ profile.user.get_full_name|default:profile.user.username }}</h3>
<div class="card border-0 shadow-sm p-4" style="max-width:600px;">
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {% include "_form_fields.html" %}
    <button type="submit" class="btn btn-success">Save</button>
    <a href="{% url 'sitecontent:staff_public_profiles' %}" class="btn btn-outline-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
