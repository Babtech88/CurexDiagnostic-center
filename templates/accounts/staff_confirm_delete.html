{% extends "base.html" %}
{% block title %}Remove Staff{% endblock %}
{% block content %}
<h3 class="mb-3">Remove {{ profile.user.username }}?</h3>
<div class="card border-0 shadow-sm p-4" style="max-width:500px;">
  <p>This will permanently delete the staff member's login and profile. This cannot be undone.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, remove</button>
    <a href="{% url 'accounts:staff_list' %}" class="btn btn-outline-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
